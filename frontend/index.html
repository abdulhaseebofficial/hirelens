<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0d11" />
    <meta
      name="description"
      content="HireLens — recruiter screening console. Score CVs against a job description, extract candidate profiles, and generate interview kits."
    />
    <title>HireLens — recruiter screening console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23EA7350'/%3E%3Cstop offset='1' stop-color='%237B6BF2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cg stroke='white' fill='none' stroke-linecap='round'%3E%3Ccircle cx='14' cy='14' r='7' stroke-width='2.6'/%3E%3Cpath d='m19.5 19.5 4.5 4.5' stroke-width='2.6'/%3E%3Cpath d='M11 14h6M14 11v6' stroke-width='2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      // Resolve the theme before first paint, so a light-mode user never sees a
      // dark flash. Mirrors resolveInitialTheme() in src/context/theme-context.ts.
      (function () {
        try {
          var stored = localStorage.getItem("hirelens-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          // Blocked storage just means the default in the markup stands.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
