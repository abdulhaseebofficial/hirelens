[project]
name = "hirelens-api"
version = "2.0.0"
description = "Recruiter CV screening API — fit scoring, candidate profiles, interview kits."
requires-python = ">=3.11"
# Vercel installs from here, the Docker image installs from requirements.txt.
# tests/test_packaging.py fails if the two lists drift apart.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
    "SQLAlchemy[asyncio]>=2.0.30,<3.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "PyJWT[crypto]>=2.8",
    "bcrypt>=4.1",
    "google-genai>=1.0",
    "PyPDF2>=3.0.1",
    "asyncpg>=0.29",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "B008", # FastAPI's Depends()/File() defaults are the documented pattern.
]

[tool.ruff.lint.per-file-ignores]
# Prompt text is written for the model, not for an 100-column terminal.
"app/services/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
